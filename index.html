<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>유아용 구름 피하기 게임</title>
    <style>
        :root {
            --sky-blue: #87CEEB;
            --cloud-white: #FFFFFF;
            --plane-red: #FF6B6B;
            --text-color: #333333;
            --btn-green: #4ECDC4;
            --btn-hover: #45b7af;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--sky-blue);
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', sans-serif; /* 유아용 폰트 느낌 */
            touch-action: none; /* 모바일에서 스크롤 방지 */
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        canvas {
            display: block;
            max-width: 600px; /* PC에서는 최대 너비 제한 */
            width: 100%;
            height: 100%;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            background: linear-gradient(to bottom, #87CEEB, #E0F6FF);
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 600px;
            height: 100%;
            pointer-events: none; /* UI 레이어 통과해서 클릭 가능하게 */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        #score-board {
            padding: 15px;
            font-size: 32px;
            font-weight: bold;
            color: var(--text-color);
            text-shadow: 2px 2px 0px var(--cloud-white);
            text-align: left;
        }

        #message-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            pointer-events: auto; /* 버튼 클릭을 위해 */
            display: none; /* 처음엔 숨김 */
            border: 5px solid var(--btn-green);
        }

        #message-box h1 {
            margin: 0 0 20px 0;
            color: var(--text-color);
            font-size: 36px;
        }

        #message-box p {
            font-size: 24px;
            margin-bottom: 30px;
        }

        button {
            background-color: var(--btn-green);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 28px;
            border-radius: 50px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            transition: transform 0.1s, background-color 0.2s;
            box-shadow: 0 5px 0 #3a9c95;
        }

        button:active {
            transform: translateY(5px);
            box-shadow: 0 0px 0 #3a9c95;
        }
        
        button:hover {
            background-color: var(--btn-hover);
        }

        #controls-hint {
            padding: 15px;
            text-align: center;
            font-size: 20px;
            color: #555;
            background: rgba(255,255,255,0.5);
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="ui-layer">
        <div id="score-board">별: <span id="score">0</span></div>
        <div id="message-box">
            <h1 id="msg-title">구름 피하기 놀이!</h1>
            <p id="msg-desc">비행기를 조종해서<br>구름을 피하고 별을 모아봐요!</p>
            <button id="start-btn">시작하기</button>
        </div>
        <div id="controls-hint">화면을 터치하거나 마우스로 끌어서 이동해요!</div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreElement = document.getElementById('score');
    const messageBox = document.getElementById('message-box');
    const msgTitle = document.getElementById('msg-title');
    const msgDesc = document.getElementById('msg-desc');
    const startBtn = document.getElementById('start-btn');
    const controlsHint = document.getElementById('controls-hint');

    // 게임 상태 변수
    let gameState = 'START'; // START, PLAYING, GAMEOVER
    let score = 0;
    let animationId;
    let frameCount = 0;
    
    // 모바일 환경 체크
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

    // 캔버스 크기 조정
    function resizeCanvas() {
        // 부모 컨테이너 크기에 맞추되, max-width 제한 고려
        const container = document.getElementById('game-container');
        let newWidth = window.innerWidth;
        if (!isMobile && newWidth > 600) newWidth = 600;
        
        canvas.width = newWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const player = {
        x: canvas.width / 2,
        y: canvas.height - 100,
        width: 60,
        height: 60,
        targetX: canvas.width / 2,
        targetY: canvas.height - 100,
        speed: 0.1, // 부드러운 이동을 위한 보간 속도

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            
            // 귀여운 비행기 그리기
            // 본체
            ctx.fillStyle = '#FF6B6B'; // 빨간색 비행기
            ctx.beginPath();
            ctx.ellipse(0, 0, this.width/2, this.height/2, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // 창문
            ctx.fillStyle = '#87CEEB';
            ctx.beginPath();
            ctx.arc(0, -this.height/4, 10, 0, Math.PI * 2);
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = 'white';
            ctx.stroke();

            // 날개
            ctx.fillStyle = '#FF8E8E';
            ctx.beginPath();
            ctx.moveTo(-this.width/2, 0);
            ctx.lineTo(-this.width, 10);
            ctx.lineTo(-this.width/2, 20);
            ctx.fill();
            
            ctx.beginPath();
            ctx.moveTo(this.width/2, 0);
            ctx.lineTo(this.width, 10);
            ctx.lineTo(this.width/2, 20);
            ctx.fill();

            ctx.restore();
        },

        update() {
            // 타겟 위치를 향해 부드럽게 이동 (Lerp)
            this.x += (this.targetX - this.x) * this.speed;
            this.y += (this.targetY - this.y) * this.speed;

            // 화면 밖으로 나가지 않게 제한
            this.x = Math.max(this.width/2, Math.min(canvas.width - this.width/2, this.x));
            this.y = Math.max(this.height/2, Math.min(canvas.height - this.height/2, this.y));
        }
    };

    let clouds = [];
    let stars = [];
    
    // 배경 효과 (작은 구름들)
    let bgClouds = [];

    // 구름 생성 함수 (유아용이므로 천천히, 둥글게)
    function spawnCloud() {
        const size = Math.random() * 40 + 40; // 40~80 크기
        const x = Math.random() * (canvas.width - size) + size/2;
        clouds.push({
            x: x,
            y: -size,
            size: size,
            speed: Math.random() * 2 + 1.5, // 느린 속도
            wobble: Math.random() * Math.PI * 2, // 좌우 흔들림 시작점
            wobbleSpeed: Math.random() * 0.05 + 0.02
        });
    }

    // 별 생성 함수
    function spawnStar() {
        const size = 25;
        const x = Math.random() * (canvas.width - size*2) + size;
        stars.push({
            x: x,
            y: -size,
            size: size,
            speed: 2,
            rotation: 0
        });
    }
    
    function spawnBgCloud() {
        const size = Math.random() * 30 + 20;
        const x = Math.random() * canvas.width;
        bgClouds.push({
            x: x,
            y: -size,
            size: size,
            speed: Math.random() * 1 + 0.5,
            opacity: Math.random() * 0.4 + 0.2
        });
    }

    function drawCloud(x, y, size, opacity = 1) {
        ctx.save();
        ctx.translate(x, y);
        ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
        
        // 뭉게구름 모양
        ctx.beginPath();
        ctx.arc(0, 0, size/2, 0, Math.PI * 2);
        ctx.arc(-size/2, size/4, size/2.5, 0, Math.PI * 2);
        ctx.arc(size/2, size/4, size/2.5, 0, Math.PI * 2);
        ctx.fill();
        
        // 살짝 그림자 줘서 입체감
        if(opacity === 1) {
            ctx.fillStyle = 'rgba(200, 220, 240, 0.5)';
            ctx.beginPath();
            ctx.arc(0, size/4, size/2.5, 0, Math.PI);
            ctx.fill();
        }
        
        ctx.restore();
    }

    function drawStar(x, y, size, rotation) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(rotation);
        
        ctx.fillStyle = '#FFD700'; // 금색
        ctx.beginPath();
        for (let i = 0; i < 5; i++) {
            ctx.lineTo(Math.cos((18 + i * 72) / 180 * Math.PI) * size,
                       -Math.sin((18 + i * 72) / 180 * Math.PI) * size);
            ctx.lineTo(Math.cos((54 + i * 72) / 180 * Math.PI) * (size/2),
                       -Math.sin((54 + i * 72) / 180 * Math.PI) * (size/2));
        }
        ctx.closePath();
        ctx.fill();
        
        // 반짝임 효과
        ctx.fillStyle = 'white';
        ctx.beginPath();
        ctx.arc(-size/4, -size/4, size/6, 0, Math.PI*2);
        ctx.fill();
        
        ctx.restore();
    }

    function checkCollisions() {
        // 구름과 충돌 (게임 오버)
        for (let i = 0; i < clouds.length; i++) {
            const cloud = clouds[i];
            // 대략적인 원형 충돌 판정
            const dx = player.x - cloud.x;
            const dy = player.y - cloud.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            
            // 유아용이므로 충돌 박스를 좀 작게 줌 (너그럽게)
            if (distance < (player.width/3 + cloud.size/2.5)) {
                gameOver();
                return;
            }
        }

        // 별과 충돌 (점수 획득)
        for (let i = stars.length - 1; i >= 0; i--) {
            const star = stars[i];
            const dx = player.x - star.x;
            const dy = player.y - star.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            
            if (distance < (player.width/2 + star.size)) {
                stars.splice(i, 1);
                score += 1;
                scoreElement.innerText = score;
                // 획득 이펙트 효과음 대신 화면 살짝 반짝임
                ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
        }
    }

    function gameOver() {
        gameState = 'GAMEOVER';
        cancelAnimationFrame(animationId);
        
        msgTitle.innerText = "앗, 구름이랑 쿵 했어요!";
        msgDesc.innerHTML = `모은 별: <strong style="color:#FFD700; font-size:32px;">${score}</strong> 개<br>다시 해볼까요?`;
        startBtn.innerText = "다시 하기";
        messageBox.style.display = 'block';
        controlsHint.style.display = 'none';
    }

    function gameLoop() {
        if (gameState !== 'PLAYING') return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. 배경 구름 처리
        if (frameCount % 60 === 0) spawnBgCloud();
        for (let i = bgClouds.length - 1; i >= 0; i--) {
            let bg = bgClouds[i];
            bg.y += bg.speed;
            drawCloud(bg.x, bg.y, bg.size, bg.opacity);
            if (bg.y > canvas.height + bg.size) bgClouds.splice(i, 1);
        }

        // 2. 별 (아이템) 처리
        // 유아용이므로 별이 자주 나오게
        if (frameCount % 100 === 0) spawnStar();
        for (let i = stars.length - 1; i >= 0; i--) {
            let star = stars[i];
            star.y += star.speed;
            star.rotation += 0.05; // 회전 애니메이션
            drawStar(star.x, star.y, star.size, star.rotation);
            if (star.y > canvas.height + star.size) stars.splice(i, 1);
        }

        // 3. 적 구름 처리
        // 난이도 조절: 처음엔 천천히, 갈수록 조금씩 자주 나옴
        let spawnRate = Math.max(60, 120 - Math.floor(score / 5) * 10);
        if (frameCount % spawnRate === 0) spawnCloud();
        
        for (let i = clouds.length - 1; i >= 0; i--) {
            let cloud = clouds[i];
            cloud.y += cloud.speed;
            // 살짝 좌우로 흔들리며 내려옴
            cloud.wobble += cloud.wobbleSpeed;
            cloud.x += Math.sin(cloud.wobble) * 1;
            
            drawCloud(cloud.x, cloud.y, cloud.size);
            
            if (cloud.y > canvas.height + cloud.size) {
                clouds.splice(i, 1);
            }
        }

        // 4. 플레이어 업데이트 및 그리기
        player.update();
        player.draw();

        // 5. 충돌 체크
        checkCollisions();

        frameCount++;
        if(gameState === 'PLAYING') {
            animationId = requestAnimationFrame(gameLoop);
        }
    }

    function updateTargetPosition(clientX, clientY) {
        if (gameState !== 'PLAYING') return;
        
        const rect = canvas.getBoundingClientRect();
        // 캔버스 내의 상대적 좌표 계산
        player.targetX = clientX - rect.left;
        
        // 터치/마우스 위치보다 살짝 위에 비행기를 둬서 손가락에 가려지지 않게 함 (터치 환경)
        let offsetY = isMobile ? 50 : 0;
        player.targetY = clientY - rect.top - offsetY;
    }

    // 마우스 이벤트
    canvas.addEventListener('mousemove', (e) => {
        updateTargetPosition(e.clientX, e.clientY);
    });

    // 터치 이벤트
    canvas.addEventListener('touchmove', (e) => {
        e.preventDefault(); // 스크롤 방지
        const touch = e.touches[0];
        updateTargetPosition(touch.clientX, touch.clientY);
    }, { passive: false });
    
    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const touch = e.touches[0];
        updateTargetPosition(touch.clientX, touch.clientY);
    }, { passive: false });

    function startGame() {
        gameState = 'PLAYING';
        score = 0;
        frameCount = 0;
        clouds = [];
        stars = [];
        bgClouds = [];
        scoreElement.innerText = score;
        messageBox.style.display = 'none';
        
        // 힌트는 시작후 잠시 뒤에 숨김
        setTimeout(() => {
            controlsHint.style.display = 'none';
        }, 3000);

        // 플레이어 초기 위치
        player.x = canvas.width / 2;
        player.y = canvas.height - 100;
        player.targetX = canvas.width / 2;
        player.targetY = canvas.height - 100;

        // 초기 배경 구름 몇 개 깔아두기
        for(let i=0; i<5; i++) {
            let size = Math.random() * 30 + 20;
            bgClouds.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: size,
                speed: Math.random() * 1 + 0.5,
                opacity: Math.random() * 0.4 + 0.2
            });
        }

        gameLoop();
    }

    startBtn.addEventListener('click', startGame);

    // 초기 화면 설정
    messageBox.style.display = 'block';

</script>
</body>
</html>
